<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <title>Bromo Escapes — Kasir</title>

  <!-- QR scanner library -->
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #f3f4f6;
      color: #111827;
      font-family: Arial, Helvetica, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    .top {
      background: #111827;
      color: white;
      text-align: center;
      padding: 14px 16px 20px;
    }
    .brand {
      font-size: 25px;
      font-weight: 800;
      letter-spacing: 1px;
    }
    .sub {
      font-size: 11px;
      margin-top: 4px;
      opacity: .85;
    }
    .wrap {
      max-width: 560px;
      margin: -1px auto 30px;
      padding: 0 14px;
    }
    .card {
      background: white;
      border-radius: 20px;
      margin-top: 14px;
      padding: 20px;
      box-shadow: 0 7px 25px rgba(0,0,0,.07);
    }
    h2 {
      text-align: center;
      margin: 0 0 18px;
      font-size: 18px;
      letter-spacing: 1px;
    }
    .camera-box {
      overflow: hidden;
      border-radius: 14px;
      background: #111827;
      min-height: 0;
    }
    #reader {
      width: 100%;
    }
    #reader video {
      width: 100% !important;
      height: auto !important;
      border-radius: 14px;
      object-fit: cover;
    }
    .camera-status {
      text-align: center;
      color: #6b7280;
      font-size: 14px;
      margin: 10px 0 16px;
      min-height: 20px;
    }
    .btn {
      width: 100%;
      border: 0;
      border-radius: 12px;
      min-height: 50px;
      padding: 12px 16px;
      font-size: 15px;
      font-weight: 700;
      color: white;
      cursor: pointer;
    }
    .btn:disabled {
      opacity: .55;
      cursor: not-allowed;
    }
    .dark { background: #111827; }
    .blue { background: #2563eb; }
    .green { background: #16a34a; }
    .gray { background: #6b7280; }
    input {
      width: 100%;
      min-height: 50px;
      border: 1px solid #d1d5db;
      border-radius: 12px;
      padding: 0 14px;
      font-size: 16px;
      outline: none;
    }
    input:focus { border-color: #2563eb; }
    .row { display: grid; gap: 10px; }
    .camera-select {
      display: none;
      margin-top: 10px;
    }
    .camera-select select {
      width: 100%;
      min-height: 46px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      padding: 0 10px;
      background: white;
      font-size: 14px;
    }
    .notice {
      border-radius: 14px;
      padding: 14px 16px;
      margin-top: 14px;
      text-align: center;
      font-size: 14px;
      font-weight: 600;
      line-height: 1.45;
    }
    .notice.error { background: #fee2e2; color: #991b1b; }
    .notice.success { background: #dcfce7; color: #166534; }
    .notice.info { background: #e0f2fe; color: #075985; }
    .notice.warn { background: #fef3c7; color: #92400e; }
    .hidden { display: none !important; }

    .customer {
      text-align: center;
    }
    .customer-id {
      font-size: 29px;
      font-weight: 800;
      letter-spacing: 1px;
    }
    .customer-name {
      font-size: 18px;
      font-weight: 700;
      margin-top: 5px;
    }
    .progress {
      margin-top: 18px;
      background: #f3f4f6;
      border-radius: 12px;
      padding: 16px;
    }
    .progress-label {
      color: #374151;
      font-size: 14px;
    }
    .progress-value {
      font-size: 25px;
      font-weight: 800;
      margin-top: 4px;
    }
    .small {
      font-size: 12px;
      color: #6b7280;
      margin-top: 8px;
      line-height: 1.4;
    }
    .debug {
      font-size: 11px;
      color: #6b7280;
      word-break: break-word;
      margin-top: 10px;
      text-align: left;
    }
  </style>
</head>

<body>
  <div class="top">
    <div class="brand">BROMO ESCAPES</div>
    <div class="sub">CUSTOMER LOYALTY • KASIR</div>
  </div>

  <main class="wrap">
    <section class="card">
      <h2>📷 SCAN QR PELANGGAN</h2>

      <div id="cameraStatus" class="camera-status">Kamera belum diaktifkan.</div>

      <div id="cameraBox" class="camera-box hidden">
        <div id="reader"></div>
      </div>

      <div id="cameraSelectBox" class="camera-select">
        <select id="cameraSelect"></select>
      </div>

      <div class="row">
        <button id="startCameraBtn" class="btn dark" type="button" onclick="startCamera()">
          📷 AKTIFKAN KAMERA
        </button>
        <button id="stopCameraBtn" class="btn gray hidden" type="button" onclick="stopCamera()">
          ⏹ MATIKAN KAMERA
        </button>
      </div>

      <div id="cameraNotice" class="notice hidden"></div>
    </section>

    <section class="card">
      <h2>⌨️ NO PELANGGAN</h2>
      <input id="customerInput" type="text" placeholder="Contoh: BE000001"
             autocomplete="off" autocapitalize="characters">
      <div style="height:10px"></div>
      <button id="searchBtn" class="btn blue" type="button" onclick="searchCustomer()">
        🔍 CARI PELANGGAN
      </button>
    </section>

    <div id="resultNotice" class="notice hidden"></div>

    <section id="customerCard" class="card hidden customer">
      <div id="customerId" class="customer-id">BE000001</div>
      <div id="customerName" class="customer-name">Nama</div>

      <div class="progress">
        <div class="progress-label">Jumlah Kunjungan</div>
        <div id="visitValue" class="progress-value">0 / 10</div>
        <div id="cycleText" class="small"></div>
      </div>

      <div style="height:10px"></div>
      <button id="checkinBtn" class="btn green" type="button" onclick="doCheckin()">
        ☑ CHECK-IN SEKARANG
      </button>
    </section>

    <div id="debug" class="debug hidden"></div>
  </main>

<script>
(() => {
  'use strict';

  const API_URL = 'https://script.google.com/macros/s/AKfycbwUrauP1WJQmXCMup0o3bAd9550mhMlF83v9eGj47ZujlQGKD-1v26XU6h502CklwIO/exec';
  const API_TOKEN = 'BROMO-KASIR-2026-9876';

  let scanner = null;
  let scannerRunning = false;
  let cameras = [];
  let currentCameraId = null;
  let scanLock = false;
  let jsonpCounter = 0;
  let pendingJsonp = new Map();

  const $ = id => document.getElementById(id);

  function setCameraStatus(text) {
    $('cameraStatus').textContent = text;
  }

  function showNotice(el, type, text) {
    el.className = 'notice ' + type;
    el.textContent = text;
    el.classList.remove('hidden');
  }

  function hideNotice(el) {
    el.classList.add('hidden');
  }

  function setDebug(text) {
    $('debug').textContent = text || '';
    $('debug').classList.toggle('hidden', !text);
  }

  function normalizeCustomerId(value) {
    return String(value || '')
      .trim()
      .toUpperCase()
      .replace(/\s+/g, '');
  }

  function extractCustomerId(decodedText) {
    const raw = String(decodedText || '').trim();

    // BE000001
    const direct = raw.match(/\bBE\d{4,}\b/i);
    if (direct) return direct[0].toUpperCase();

    // URL: ?customer=BE000001
    try {
      const u = new URL(raw);
      const q = u.searchParams.get('customer') || u.searchParams.get('id') || u.searchParams.get('no');
      if (q) {
        const found = String(q).match(/\bBE\d{4,}\b/i);
        if (found) return found[0].toUpperCase();
      }
    } catch (_) {}

    // BROMO_ESCAPES|BE000001
    const parts = raw.split('|');
    for (const part of parts) {
      const found = part.match(/\bBE\d{4,}\b/i);
      if (found) return found[0].toUpperCase();
    }

    return normalizeCustomerId(raw);
  }

  function jsonp(action, params = {}) {
    return new Promise((resolve, reject) => {
      const callback = '__bromo_jsonp_' + (++jsonpCounter) + '_' + Date.now();
      const script = document.createElement('script');
      const timeout = setTimeout(() => {
        cleanup();
        reject(new Error('Waktu koneksi ke server habis.'));
      }, 20000);

      function cleanup() {
        clearTimeout(timeout);
        delete window[callback];
        if (script.parentNode) script.parentNode.removeChild(script);
        pendingJsonp.delete(callback);
      }

      window[callback] = data => {
        cleanup();
        resolve(data);
      };

      pendingJsonp.set(callback, true);

      const query = new URLSearchParams();
      query.set('action', action);
      query.set('callback', callback);
      query.set('token', API_TOKEN);

      Object.entries(params).forEach(([key, value]) => {
        if (value !== undefined && value !== null) {
          query.set(key, String(value));
        }
      });

      script.src = API_URL + '?' + query.toString();
      script.onerror = () => {
        cleanup();
        reject(new Error('Server Apps Script tidak dapat dihubungi.'));
      };

      document.head.appendChild(script);
    });
  }

  async function startCamera(preferredId = null) {
    if (scannerRunning) return;

    hideNotice($('cameraNotice'));
    setDebug('');

    if (!window.isSecureContext) {
      showNotice($('cameraNotice'), 'error',
        '🔒 Kamera membutuhkan HTTPS. Buka scanner melalui alamat https://....github.io/....');
      setCameraStatus('Halaman tidak menggunakan HTTPS.');
      return;
    }

    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      showNotice($('cameraNotice'), 'error',
        '📵 Browser ini tidak mendukung akses kamera. Gunakan Chrome/Safari versi terbaru.');
      setCameraStatus('Akses kamera tidak tersedia.');
      return;
    }

    $('startCameraBtn').disabled = true;
    setCameraStatus('Meminta izin kamera...');

    try {
      // Important: explicitly request permission first.
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: 'environment' } },
        audio: false
      });

      stream.getTracks().forEach(track => track.stop());

      setCameraStatus('Mencari kamera yang tersedia...');
      cameras = await Html5Qrcode.getCameras();

      if (!cameras || cameras.length === 0) {
        throw new Error('Kamera tidak ditemukan setelah izin diberikan.');
      }

      populateCameraList(cameras);

      let selectedId = preferredId || chooseBestCamera(cameras);

      await startScannerWithCamera(selectedId);

    } catch (err) {
      $('startCameraBtn').disabled = false;
      scannerRunning = false;

      const message = cameraErrorMessage(err);
      setCameraStatus(message.short);
      showNotice($('cameraNotice'), 'error', message.long);
      setDebug('Detail browser: ' + (err && err.name ? err.name + ' — ' : '') + (err && err.message ? err.message : String(err)));
    }
  }

  function chooseBestCamera(list) {
    const backKeywords = ['back', 'rear', 'environment', 'belakang', 'world'];
    const found = list.find(cam => {
      const label = String(cam.label || '').toLowerCase();
      return backKeywords.some(k => label.includes(k));
    });
    return found ? found.id : list[0].id;
  }

  function populateCameraList(list) {
    const box = $('cameraSelectBox');
    const select = $('cameraSelect');
    select.innerHTML = '';

    if (list.length <= 1) {
      box.style.display = 'none';
      return;
    }

    list.forEach((cam, index) => {
      const option = document.createElement('option');
      option.value = cam.id;
      option.textContent = cam.label || ('Kamera ' + (index + 1));
      select.appendChild(option);
    });

    select.value = currentCameraId || chooseBestCamera(list);
    box.style.display = 'block';

    select.onchange = async () => {
      const id = select.value;
      await stopCamera(false);
      await startCamera(id);
    };
  }

  async function startScannerWithCamera(cameraId) {
    if (scannerRunning) await stopCamera(false);

    $('cameraBox').classList.remove('hidden');
    $('stopCameraBtn').classList.remove('hidden');
    $('startCameraBtn').classList.add('hidden');

    if (!scanner) scanner = new Html5Qrcode('reader');

    currentCameraId = cameraId;
    setCameraStatus('Kamera aktif. Arahkan QR pelanggan ke kotak scanner...');

    await scanner.start(
      { deviceId: { exact: cameraId } },
      {
        fps: 10,
        qrbox: (viewfinderWidth, viewfinderHeight) => {
          const size = Math.floor(Math.min(viewfinderWidth, viewfinderHeight) * 0.72);
          return { width: size, height: size };
        },
        aspectRatio: 1.0
      },
      onQrSuccess,
      () => {}
    );

    scannerRunning = true;
  }

  async function stopCamera(showStatus = true) {
    try {
      if (scanner && scannerRunning) {
        await scanner.stop();
      }
    } catch (_) {}

    scannerRunning = false;
    scanLock = false;

    $('cameraBox').classList.add('hidden');
    $('stopCameraBtn').classList.add('hidden');
    $('startCameraBtn').classList.remove('hidden');
    $('startCameraBtn').disabled = false;

    if (showStatus) setCameraStatus('Kamera dimatikan.');
  }

  async function onQrSuccess(decodedText) {
    if (scanLock) return;
    scanLock = true;

    const customerId = extractCustomerId(decodedText);

    if (!/^BE\d{4,}$/i.test(customerId)) {
      scanLock = false;
      showNotice($('cameraNotice'), 'warn',
        'QR terbaca, tetapi No Pelanggan tidak ditemukan. Pastikan QR berasal dari Bromo Escapes.');
      return;
    }

    $('customerInput').value = customerId;
    showNotice($('cameraNotice'), 'success', 'QR terbaca: ' + customerId);

    // Stop camera before server call to prevent repeated scans.
    await stopCamera(false);
    await searchCustomer(customerId);
  }

  function cameraErrorMessage(err) {
    const name = err && err.name ? err.name : '';
    const msg = err && err.message ? err.message : '';

    if (name === 'NotAllowedError' || name === 'PermissionDeniedError') {
      return {
        short: 'Izin kamera ditolak.',
        long: '🚫 Izin kamera ditolak. Buka pengaturan situs/browser lalu izinkan Camera untuk halaman GitHub ini, kemudian reload halaman.'
      };
    }
    if (name === 'NotFoundError' || name === 'DevicesNotFoundError') {
      return {
        short: 'Kamera tidak ditemukan.',
        long: '📷 Kamera tidak ditemukan. Pastikan perangkat memiliki kamera dan browser mendapat izin kamera.'
      };
    }
    if (name === 'NotReadableError' || name === 'TrackStartError') {
      return {
        short: 'Kamera sedang digunakan.',
        long: '⚠️ Kamera tidak dapat dibaca. Tutup aplikasi/browser lain yang sedang memakai kamera, lalu coba lagi.'
      };
    }
    if (name === 'SecurityError') {
      return {
        short: 'Akses kamera diblokir browser.',
        long: '🔒 Browser memblokir akses kamera. Pastikan halaman dibuka melalui HTTPS dan izin Camera untuk situs ini adalah Allow.'
      };
    }
    if (name === 'OverconstrainedError') {
      return {
        short: 'Konfigurasi kamera tidak cocok.',
        long: '⚙️ Kamera belakang tidak cocok dengan konfigurasi awal. Coba aktifkan kembali kamera; versi ini akan mencoba kamera lain secara otomatis.'
      };
    }

    return {
      short: 'Kamera gagal dibuka.',
      long: '❌ Kamera gagal dibuka. Pastikan HTTPS aktif, izin kamera diberikan, dan tidak ada aplikasi lain yang sedang memakai kamera.'
    };
  }

  async function searchCustomer(forcedId = null) {
    const id = normalizeCustomerId(forcedId || $('customerInput').value);

    if (!/^BE\d{4,}$/.test(id)) {
      showNotice($('resultNotice'), 'error', 'Masukkan No Pelanggan yang valid, contoh BE000001.');
      $('customerCard').classList.add('hidden');
      return;
    }

    $('searchBtn').disabled = true;
    showNotice($('resultNotice'), 'info', '🔎 Mencari pelanggan ' + id + '...');

    try {
      const response = await jsonp('search', { customerId: id });

      if (!response || response.success === false) {
        throw new Error(response && response.message ? response.message : 'Pelanggan tidak ditemukan.');
      }

      const data = response.data || response.customer || response;

      const customerId = data.noPelanggan || data.customerId || data.id || id;
      const name = data.nama || data.name || '-';
      const visits = Number(data.jumlahKunjungan ?? data.visits ?? data.visitCount ?? 0);

      $('customerId').textContent = customerId;
      $('customerName').textContent = name;
      $('visitValue').textContent = Math.max(0, visits) + ' / 10';

      const cycle = data.siklusBerakhir || data.cycleEnd || data.voucherExpired || '';
      $('cycleText').textContent = cycle ? 'Siklus loyalty: ' + cycle : '';

      $('customerCard').classList.remove('hidden');
      showNotice($('resultNotice'), 'success', '✅ Pelanggan ditemukan.');

      const canCheckin = data.canCheckin !== false && data.bolehCheckin !== false;
      $('checkinBtn').disabled = !canCheckin;

      if (!canCheckin && (data.message || data.reason)) {
        showNotice($('resultNotice'), 'error', '❌ ' + (data.message || data.reason));
      }
    } catch (err) {
      $('customerCard').classList.add('hidden');
      showNotice($('resultNotice'), 'error', '❌ ' + (err.message || 'Gagal mencari pelanggan.'));
      setDebug('Search error: ' + (err && err.stack ? err.stack : String(err)));
    } finally {
      $('searchBtn').disabled = false;
      scanLock = false;
    }
  }

  async function doCheckin() {
    const customerId = normalizeCustomerId($('customerId').textContent);
    if (!/^BE\d{4,}$/.test(customerId)) return;

    const btn = $('checkinBtn');
    btn.disabled = true;
    btn.textContent = '⏳ MEMPROSES CHECK-IN...';

    try {
      const response = await jsonp('checkin', { customerId });

      if (!response || response.success === false) {
        throw new Error(response && response.message ? response.message : 'Check-in ditolak.');
      }

      const data = response.data || response;
      const visits = Number(data.jumlahKunjungan ?? data.visits ?? data.visitCount ?? 0);
      const checkinNumber = data.checkinKe || data.visitNumber || visits;
      const reward = data.reward || data.rewardAmount || '';

      let message = 'CHECK-IN BERHASIL — Check-in ke-' + checkinNumber + '. Progress: ' + visits + ' / 10.';
      if (reward) {
        message += ' 🎁 Reward ' + formatRupiah(reward) + ' telah dibuat.';
      }

      showNotice($('resultNotice'), 'success', '✅ ' + message);
      $('visitValue').textContent = Math.max(0, visits) + ' / 10';

      if (data.siklusBerakhir || data.cycleEnd) {
        $('cycleText').textContent = 'Siklus loyalty: ' + (data.siklusBerakhir || data.cycleEnd);
      }

      btn.textContent = '☑ CHECK-IN BERHASIL';

      // Keep customer card visible so cashier can see the result.
      // Camera can be activated again for the next customer.
      setTimeout(() => {
        btn.textContent = '☑ CHECK-IN SEKARANG';
        btn.disabled = false;
      }, 2500);

    } catch (err) {
      showNotice($('resultNotice'), 'error', '❌ ' + (err.message || 'Check-in gagal.'));
      btn.disabled = false;
      btn.textContent = '☑ CHECK-IN SEKARANG';
      setDebug('Check-in error: ' + (err && err.stack ? err.stack : String(err)));
    }
  }

  function formatRupiah(value) {
    const n = Number(String(value).replace(/[^\d.-]/g, ''));
    if (!Number.isFinite(n)) return String(value);
    return new Intl.NumberFormat('id-ID', {
      style: 'currency',
      currency: 'IDR',
      maximumFractionDigits: 0
    }).format(n);
  }

  // Improve iOS/Android camera compatibility:
  // after permission is granted, enumerateDevices is allowed to reveal labels.
  async function warmupCameraPermission() {
    try {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return;
      const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
      stream.getTracks().forEach(t => t.stop());
    } catch (_) {}
  }

  // Enter key in manual customer field.
  $('customerInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') searchCustomer();
  });

  // Release camera if browser navigates away.
  window.addEventListener('pagehide', () => {
    try {
      if (scanner && scannerRunning) scanner.stop();
    } catch (_) {}
  });
})();
</script>
</body>
</html>
