<!DOCTYPE html>

<html lang="id">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Bromo Escapes - Kasir</title>


<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>


<style>

* {
  box-sizing:border-box;
}

body {

  margin:0;

  background:#f3f4f6;

  font-family:
    Arial,
    sans-serif;

  color:#111827;

}

.header {

  background:#111827;

  color:white;

  text-align:center;

  padding:24px 15px;

}

.logo {

  font-size:25px;

  font-weight:800;

  letter-spacing:1px;

}

.sub {

  font-size:12px;

  color:#cbd5e1;

  margin-top:5px;

}

.container {

  max-width:600px;

  margin:auto;

  padding:18px;

}

.card {

  background:white;

  border-radius:18px;

  padding:20px;

  margin-bottom:16px;

  box-shadow:
    0 5px 20px
    rgba(0,0,0,.07);

}

.title {

  text-align:center;

  font-size:19px;

  font-weight:800;

  margin-bottom:16px;

}

#reader {

  width:100%;

  overflow:hidden;

  border-radius:15px;

}

button {

  width:100%;

  border:0;

  border-radius:12px;

  padding:15px;

  margin-top:10px;

  font-size:16px;

  font-weight:700;

}

.start {

  background:#111827;

  color:white;

}

.stop {

  background:#dc2626;

  color:white;

}

.search {

  background:#2563eb;

  color:white;

}

.checkin {

  background:#16a34a;

  color:white;

  font-size:18px;

}

input {

  width:100%;

  padding:15px;

  border:
    1px solid
    #d1d5db;

  border-radius:12px;

  font-size:17px;

}

.status {

  text-align:center;

  padding:12px;

  color:#6b7280;

}

.customer {

  display:none;

}

.customer-id {

  text-align:center;

  font-size:30px;

  font-weight:800;

}

.customer-name {

  text-align:center;

  font-size:20px;

  font-weight:700;

  margin:8px 0 18px;

}

.progress {

  text-align:center;

  background:#f3f4f6;

  padding:15px;

  border-radius:12px;

}

.result {

  display:none;

  padding:18px;

  border-radius:15px;

  text-align:center;

  margin-bottom:15px;

  font-weight:700;

  line-height:1.5;

}

.success {

  display:block;

  background:#dcfce7;

  color:#166534;

}

.error {

  display:block;

  background:#fee2e2;

  color:#991b1b;

}

.reward {

  font-size:28px;

  font-weight:900;

  margin-top:8px;

}

</style>

</head>


<body>


<div class="header">

  <div class="logo">
    BROMO ESCAPES
  </div>

  <div class="sub">
    CUSTOMER LOYALTY • KASIR
  </div>

</div>


<div class="container">


<div class="card">

  <div class="title">
    📷 SCAN QR PELANGGAN
  </div>


  <div id="reader"></div>


  <div
    id="cameraStatus"
    class="status"
  >
    Tekan tombol untuk membuka kamera.
  </div>


  <button
    class="start"
    id="startBtn"
    onclick="startScanner()"
  >
    📷 AKTIFKAN KAMERA
  </button>


  <button
    class="stop"
    id="stopBtn"
    onclick="stopScanner()"
    style="display:none"
  >
    ⛔ MATIKAN KAMERA
  </button>

</div>



<div class="card">

  <div class="title">
    ⌨️ NO PELANGGAN
  </div>


  <input
    id="customerInput"
    placeholder="BE000001"
  >


  <button
    class="search"
    onclick="searchCustomer()"
  >
    🔍 CARI PELANGGAN
  </button>

</div>



<div
  id="result"
  class="result"
></div>



<div
  id="customerCard"
  class="card customer"
>


  <div class="customer-id"
       id="customerId">
  </div>


  <div class="customer-name"
       id="customerName">
  </div>


  <div class="progress">

    Jumlah Kunjungan

    <div
      id="visits"
      style="
        font-size:25px;
        font-weight:800;
        margin-top:5px;
      "
    >
      0 / 10
    </div>

  </div>


  <button
    class="checkin"
    onclick="checkIn()"
  >
    ✅ CHECK-IN SEKARANG
  </button>

</div>


</div>



<script>


/* =====================================================
   CONFIG
===================================================== */


/*
 * MASUKKAN URL WEB APP APPS SCRIPT ANDA
 *
 * Contoh:
 *
 * https://script.google.com/macros/s/XXXXXXXX/exec
 */

const API_URL =
  'https://script.google.com/macros/s/AKfycbwUrauP1WJQmXCMup0o3bAd9550mhMlF83v9eGj47ZujlQGKD-1v26XU6h502CklwIO/exec';


/*
 * HARUS SAMA DENGAN API_TOKEN
 * DI CODE.GS
 */

const API_TOKEN =
  'BROMO-KASIR-2026-9876';



/* =====================================================
   GLOBAL
===================================================== */

let scanner = null;

let currentCustomer = null;

let scannerRunning = false;



/* =====================================================
   JSONP REQUEST
===================================================== */

function apiRequest(
  action,
  customer,
  callback
) {


  const callbackName =
    'bromoCallback_' +
    Date.now();


  window[callbackName] =
    function(data) {


      try {

        callback(
          data
        );

      }

      finally {

        delete window[
          callbackName
        ];

        if (
          script &&
          script.parentNode
        ) {

          script.parentNode
            .removeChild(
              script
            );

        }

      }

    };


  const script =
    document.createElement(
      'script'
    );


  let url =
    API_URL +
    '?action=' +
    encodeURIComponent(
      action
    ) +

    '&customer=' +
    encodeURIComponent(
      customer || ''
    ) +

    '&token=' +
    encodeURIComponent(
      API_TOKEN
    ) +

    '&callback=' +
    encodeURIComponent(
      callbackName
    );


  script.src =
    url;


  script.onerror =
    function() {

      delete window[
        callbackName
      ];

      showError(
        'Server tidak dapat dihubungi.'
      );

    };


  document
    .body
    .appendChild(
      script
    );

}



/* =====================================================
   START SCANNER
===================================================== */

async function startScanner() {


  if (
    scannerRunning
  ) {

    return;

  }


  const status =
    document.getElementById(
      'cameraStatus'
    );


  status.innerText =
    '⏳ Membuka kamera...';


  try {


    scanner =
      new Html5Qrcode(
        'reader'
      );


    await scanner.start(

      {
        facingMode:
          'environment'
      },

      {

        fps:10,

        qrbox:
          function(
            width,
            height
          ) {

            const size =
              Math.floor(
                Math.min(
                  width,
                  height
                ) * .70
              );


            return {

              width:size,

              height:size

            };

          }

      },

      function(decodedText) {

        onQRCode(
          decodedText
        );

      },

      function() {}

    );


    scannerRunning =
      true;


    document
      .getElementById(
        'startBtn'
      )
      .style.display =
      'none';


    document
      .getElementById(
        'stopBtn'
      )
      .style.display =
      'block';


    status.innerHTML =
      '🟢 <b>Kamera aktif</b><br>' +
      'Arahkan ke QR pelanggan.';


  }

  catch(error) {


    console.error(
      error
    );


    status.innerHTML =
      '🔴 <b>Kamera gagal dibuka.</b><br>' +
      '<small>' +
      'Pastikan halaman dibuka melalui HTTPS ' +
      'dan izin kamera diberikan.' +
      '</small>';

  }

}



/* =====================================================
   STOP
===================================================== */

async function stopScanner() {


  if (
    scanner &&
    scannerRunning
  ) {


    try {

      await scanner.stop();

    }

    catch(e) {}

  }


  scannerRunning =
    false;


  document
    .getElementById(
      'startBtn'
    )
    .style.display =
    'block';


  document
    .getElementById(
      'stopBtn'
    )
    .style.display =
    'none';


  document
    .getElementById(
      'cameraStatus'
    )
    .innerText =
    'Kamera dimatikan.';

}



/* =====================================================
   QR DETECTED
===================================================== */

function onQRCode(
  text
) {


  const customerId =
    extractCustomerId(
      text
    );


  if (!customerId) {

    showError(
      'QR pelanggan tidak valid.'
    );

    return;

  }


  stopScanner();


  document
    .getElementById(
      'customerInput'
    )
    .value =
    customerId;


  searchCustomer();

}



/* =====================================================
   EXTRACT ID
===================================================== */

function extractCustomerId(
  text
) {


  text =
    String(
      text || ''
    )
    .trim();


  /*
   * BE000001
   */

  let match =
    text.match(
      /BE\d+/i
    );


  if (match) {

    return match[0]
      .toUpperCase();

  }


  /*
   * Jika QR berisi:
   *
   * BROMO_ESCAPES|BE000001
   */

  if (
    text.includes('|')
  ) {

    const parts =
      text.split('|');


    for (
      let i = 0;
      i < parts.length;
      i++
    ) {

      match =
        parts[i].match(
          /BE\d+/i
        );


      if (match) {

        return match[0]
          .toUpperCase();

      }

    }

  }


  return null;

}



/* =====================================================
   SEARCH
===================================================== */

function searchCustomer() {


  const id =
    document
      .getElementById(
        'customerInput'
      )
      .value
      .trim()
      .toUpperCase();


  if (!id) {

    showError(
      'Masukkan No Pelanggan.'
    );

    return;

  }


  setLoading(
    true
  );


  apiRequest(

    'search',

    id,

    function(data) {


      setLoading(
        false
      );


      if (
        !data ||
        !data.success
      ) {

        showError(
          data.message ||
          'Pelanggan tidak ditemukan.'
        );

        return;

      }


      currentCustomer =
        data.customer;


      document
        .getElementById(
          'customerId'
        )
        .innerText =
        data.customer.customerId;


      document
        .getElementById(
          'customerName'
        )
        .innerText =
        data.customer.name;


      document
        .getElementById(
          'visits'
        )
        .innerText =

        data.customer.visits +
        ' / 10';


      document
        .getElementById(
          'customerCard'
        )
        .style.display =
        'block';


      hideResult();

    }

  );

}



/* =====================================================
   CHECK IN
===================================================== */

function checkIn() {


  if (
    !currentCustomer
  ) {

    showError(
      'Pelanggan belum dipilih.'
    );

    return;

  }


  const id =
    currentCustomer
      .customerId;


  setLoading(
    true
  );


  apiRequest(

    'checkin',

    id,

    function(data) {


      setLoading(
        false
      );


      if (
        !data ||
        !data.success
      ) {

        showError(
          data.message ||
          'Check-in gagal.'
        );

        return;

      }


      if (
        data.reward
      ) {


        showSuccess(

          '🎉 CHECK-IN KE-10 BERHASIL!' +

          '<div class="reward">' +

          'Rp300.000' +

          '</div>' +

          '<div>' +

          'Reward berhasil diperoleh.' +

          '</div>'

        );


      }

      else {


        showSuccess(

          '✅ CHECK-IN BERHASIL' +

          '<br><br>' +

          'Progress: ' +

          data.visits +

          ' / 10'

        );

      }


      document
        .getElementById(
          'customerCard'
        )
        .style.display =
        'none';


      currentCustomer =
        null;


      document
        .getElementById(
          'customerInput'
        )
        .value =
        '';

    }

  );

}



/* =====================================================
   LOADING
===================================================== */

function setLoading(
  loading
) {

  if (loading) {

    showResult(
      '⏳ Memproses...'
    );

  }

}



/* =====================================================
   RESULT
===================================================== */

function showSuccess(
  text
) {


  const el =
    document.getElementById(
      'result'
    );


  el.className =
    'result success';


  el.innerHTML =
    text;

}


function showError(
  text
) {


  const el =
    document.getElementById(
      'result'
    );


  el.className =
    'result error';


  el.innerHTML =
    '❌ ' +
    text;

}


function showResult(
  text
) {


  const el =
    document.getElementById(
      'result'
    );


  el.className =
    'result';


  el.innerHTML =
    text;


  el.style.display =
    'block';

}


function hideResult() {


  const el =
    document.getElementById(
      'result'
    );


  el.className =
    'result';


  el.style.display =
    'none';

}

</script>

</body>

</html>
